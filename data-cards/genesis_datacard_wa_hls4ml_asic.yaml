# ============================================================
# INTEROPERABILITY
# ============================================================
interoperability:
  data_structure:
    formats:
      - JSON    # per-design synthesis report (Config, QOFRSummary, AreaReport, DesignSummary, LayerResults)
      - tar.gz  # per-design Catapult project archive (RTL, HLS logs, intermediate synthesis artifacts)
    encoding: UTF-8
    schema_version: "1.0"
    modalities:
      - tabular
    features:
      - name: latency_cycles
        data_type: int
        unit: clock cycles
        description: Pipeline latency from input valid to output valid at 5 ns clock.
      - name: thruput_cycles
        data_type: int
        unit: clock cycles
        description: Initiation interval (throughput) — minimum cycles between successive inputs.
      - name: total_area
        data_type: float
        unit: µm²
        description: Total synthesised circuit area (TotalAreaScore from Catapult AreaReport).
      - name: TotalReg
        data_type: float
        unit: µm²
        description: Total register area component.
      - name: DataPath
        data_type: float
        unit: µm²
        description: Datapath area (MUX + FUNC + LOGIC + BUFFER + MEM + ROM + REG).
      - name: MUX
        data_type: float
        unit: µm²
        description: Multiplexer area contribution.
      - name: FUNC
        data_type: float
        unit: µm²
        description: Functional (combinational logic) area contribution.
      - name: n_layers
        data_type: int
        description: Number of dense (QDense) layers in the network.
      - name: layer_sizes
        data_type: list[int]
        description: Neuron count per layer (input dim → l1 → … → output dim).
      - name: activations
        data_type: list[str]
        description: Activation function per layer (relu | sigmoid | tanh).
      - name: bitwidth
        data_type: int
        unit: bits
        description: Fixed-point weight precision W in ac_fixed<W,3> (W ∈ {4,6,8,10,12,14}).
      - name: reuse_factor
        data_type: int
        description: Catapult HLS ReuseFactor (1=fully unrolled, 4/8/16=partially reused).
      - name: tech
        data_type: str
        description: Target ASIC technology (nangate45 | gf22fdx).
    splits: []
    language: not_applicable
    spatial_coverage:
    temporal_coverage:

  provenance:
    was_generated_by: >-
      Automated Catapult HLS 2026.1 (Siemens EDA) synthesis of hls4ml-generated
      C++ accelerator designs on NERSC Perlmutter, orchestrated by GNU parallel
      SLURM jobs using wa-hls4ml-search.
    source_data:
      - name: wa-hls4ml FPGA/Vivado Dataset
        identifier:
          type: url
          value: https://huggingface.co/datasets/fastmachinelearning/wa-hls4ml
        relationship: references
    processing_steps: >-
      (1) Neural network architecture parameters sampled via Cartesian enumeration
      (1–3 layers) or Latin Hypercube Sampling (4–10 layers; GF22FDX 2–3 layers).
      (2) hls4ml C++ HLS project generated per design with QKeras quantisation
      (ac_fixed<W,3> weights, auto-precision for activations).
      (3) Catapult HLS synthesises to RTL, targeting 5 ns clock; reports written
      to JSON; synthesis outputs bundled in tar.gz per design.
      (4) Failed runs retried with GNU parallel --resume-failed; hard failures
      (missing tarballs) documented in failed_designs.txt per run group.
      (5) Reports aggregated into per-run JSON collections; tarballs archived flat
      under nangate45/ or gf22fdx/ on CFS.
    instrumentation: >-
      Catapult HLS 2026.1 (Siemens EDA); Nangate 45 nm Open Cell Library
      (nangate-45nm_beh); GlobalFoundries 22FDX FD-SOI standard-cell library
      (GF22FDX_SC8T_104CPP_BASE_CSC24R_TT_0P90V_0P00V_0P00V_0P00V_25C_dc).
    simulation_details: >-
      Fixed synthesis settings across all designs: Clock=5 ns (200 MHz),
      ClockUncertainty=12.5%, IOType=io_stream, Strategy=Latency, BramFactor=0.
      Weight interface: programmable (weights/biases passed as top-level function
      arguments). ReuseFactor varies: 1 (fully unrolled), 4, 8, 16.
    software_environment:
      os: "RHEL 8 (NERSC Perlmutter)"
      compiler:
      container: "Apptainer container with Catapult 2026.1 (Siemens)"
      hpc_environment: >-
        NERSC Perlmutter CPU nodes; SLURM 3-node × 100-slot GNU parallel batches;
        AmSC project account amsc011; QoS express_amsc (6h) or regular (48h).
      notes: >-
        Python venv at $SCRATCH/venv_hls4ml (hls4ml, QKeras, tensorflow, scipy).
        Orchestration scripts: wa-hls4ml-search/slurm/examples/ on branch
        Catapult-ASIC-dev. License server: 300 Catapult seats (fasic-admin1.fnal.gov).

  dates:
    data_collection_start: "2026-05-04"
    data_collection_end:
    issued:
    modified: "2026-06-25"

  semantic_layer:
    schema_url:
    semantic_context: []

  related_resources:
    datasets:
      - name: "wa-hls4ml FPGA/Vivado Results Dataset"
        identifier:
          type: url
          value: https://huggingface.co/datasets/fastmachinelearning/wa-hls4ml
        relationship: is_based_on
      - name: "wa-hls4ml FPGA/Vivado Projects Dataset"
