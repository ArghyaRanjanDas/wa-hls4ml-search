    current_use: >-
      ML surrogate model training and evaluation for ASIC latency, throughput,
      and area prediction in the wa-hls4ml project.
    intended_use: >-
      Training and evaluating graph neural network and transformer surrogate models
      that predict Catapult HLS synthesis outcomes (latency, area) for arbitrary
      quantized dense neural network architectures without invoking the HLS tool.
    permitted_use: >-
      ASIC design-space exploration; benchmark for HLS resource estimation methods;
      neural architecture search targeting ASIC deployment; educational use in
      hardware-aware ML courses.
    out_of_scope_use: >-
