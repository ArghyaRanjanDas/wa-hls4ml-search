    maintainer:
      type: person
      person:
        given_name: Giuseppe
        family_name: Di Guglielmo
        email: giuseppe.diguglielmo@gmail.com
        affiliation:
          name: Columbia University
          ror_id: https://ror.org/00hj8s172
    update_frequency: Ad_Hoc
    retention_policy: "Retained on NERSC CFS (amsc011) indefinitely; tarballed to HPSS for long-term archival."
    versioning_strategy: "Major version increment when new technology nodes or qualitatively different topology groups are added; minor version for additional sweep coverage."

  data_quality:
    completeness: >-
      Cartesian sweeps (1–3 layers) verified complete with no missing or duplicate
      designs. LHS and GF22FDX sweeps contain a small number of hard synthesis
      failures (absent outputs) that are documented and excluded from
      training-eligible counts.
    known_issues: >-
      (1) GF22FDX 2-layer Pass 1 under-samples bitwidths {6,10,14} and size=64.
      (2) A small number of hard Catapult synthesis failures exist in LHS and
      GF22FDX runs; affected designs are absent from the output archive.
      (3) 1,341 legacy fixed-weight designs exist in the archive but are excluded
      from training-eligible counts.
      (4) Catapult AutoCompact may reduce distinct RTL outputs by ~3% for 3-layer
      designs; synthesis parameter space is complete as enumerated.
    validation_methods: >-
      Design completeness verified by cross-checking synthesised output counts
      against expected parameter-space sizes. LHS candidate files retained for
      reproducibility.
    noise_characteristics: >-
      Synthesis results are deterministic given the same Catapult version, library,
      and input C++. No measurement noise; minor variation may occur due to tool
      internal heuristics but has not been measured.
    uncertainty_notes: "No stochastic uncertainty in synthesis outputs. Variability arises only from different ReuseFactor or architecture parameters."
    missing_data_codes:
      - code: "absent tarball"
        description: "Hard synthesis failure; design stem present in joblist but no .tar.gz produced."

  citation:
    preferred_citation:
      author: >-
        Hawks, Benjamin and Weitz, Jason and Demler, Dmitri and Tame-Narvaez, Karla
        and Plotnikov, Dennis and Rahimifar, Mohammad Mehdi and Ezzaoui Rahali, Hamza
        and Therrien, Audrey C. and Sproule, Donovan and Khoda, Elham E.
        and Smith, Keegan A. and Marroquin, Russell and Di Guglielmo, Giuseppe
        and Tran, Nhan and Duarte, Javier and Loncar, Vladimir
      title: "wa-hls4ml: A Benchmark and Surrogate Models for hls4ml Resource and Latency Estimation"
      year: "2025"
      howpublished: "arXiv preprint"
      url: https://arxiv.org/abs/2511.05615
      eprinttype: arxiv
      eprint: "2511.05615"

  integrity:
    checksum_available: "No"
    fixity_policy: "NERSC CFS provides RAID storage; long-term copies archived to HPSS via htar per-run tarballs."

