# ============================================================
# AI USABILITY
# ============================================================
ai_usability:
  ai_usage:
    training_use_status: "Yes"
    training_use_conditions: >-
      Cite the wa-hls4ml paper (arXiv:2511.05615) when using this dataset for
      model training or publication.
    inference_use_status: "Yes"
    inference_use_conditions: >-
      Intended as training data; inference use (e.g., as a lookup table or
      validation benchmark) is permitted with attribution.
    evaluation_use_status: "Yes"
    evaluation_use_conditions: >-
      Benchmark evaluations of HLS resource prediction methods should cite the
      wa-hls4ml paper.
    restrictions: >-
      Not suitable for timing sign-off or production silicon design without
      additional full-flow verification.
    bias_risks: >-
      Architecture space is not uniformly distributed across the full feasible
      design space: 1–3-layer designs use exhaustive Cartesian coverage while
      4–10-layer designs use LHS with N=2,500–10,000; GF22FDX coverage is sparser
      than nangate45. Models trained on this dataset may under-perform for
      architectures outside the sampled distribution (e.g., very deep networks or
      extreme neuron counts).
    safety_considerations: "None — synthesis results contain no sensitive or safety-critical information."
    human_review_required: "No"
