  # --- Identification -------------------------------------------
  identification:
    name: "wa-hls4ml ASIC Synthesis Dataset"
    project: "genesis"
    version: "1.0"

    primary_id:
      type: local
      value: wa-hls4ml-catapult-asic-v1.0

    additional_ids:
      - type: url
        value: https://arxiv.org/abs/2511.05615  # older FPGA paper; update with ASIC paper when available

    supersedes:
    superseded_by:
    parent_collection:

  # --- Description ----------------------------------------------
  dataset_description:
    science_domain: "Engineering"

    dataset_summary: >-
      Siemens Catapult HLS (v2026.1_1) synthesis results for 529,507 quantized dense
      neural networks (QKeras QDense layers) targeting two ASIC technology nodes:
      Nangate 45 nm Open Cell Library (485,905 designs) and GlobalFoundries 22FDX
      FD-SOI (43,602 designs). Each record reports latency, throughput (initiation
      interval), and total chip area for a specific network architecture (1–10 layers,
      4–128 neurons/layer, bitwidths 4–14 bits, activations relu/sigmoid/tanh) and
      synthesis configuration (ReuseFactor 1/4/8/16). The dataset is generated to
      train surrogate models for rapid ASIC resource and timing estimation in the
      wa-hls4ml project.

    purpose: >-
      To provide a large-scale, systematically sampled benchmark of ASIC synthesis
      outcomes for quantized dense neural networks, enabling data-driven surrogate
      models that predict latency and area without invoking the full HLS tool flow.
      The Siemens Catapult HLS targeting ASIC technology nodes extends the original
      wa-hls4ml FPGA/Vivado dataset to cover two ASIC technology nodes.

    collection_methodology: >-
      Automated Siemens Catapult HLS (v2026.1_1) synthesis via hls4ml on NERSC
      Perlmutter, using GNU parallel SLURM jobs (3 nodes × 100 concurrent Catapult
      instances = 300 licenses). For Nangate 45 nm: architectures were enumerated
      by full Cartesian product (1–3 layers) or Latin Hypercube Sampling (LHS,
      4–10 layers), all generated from scratch. For GF22FDX: the 1-layer sweep
      uses the same full Cartesian product as 45 nm; 2–3-layer architectures are
      a subset re-synthesised from the 45 nm pool via LHS sampling. All designs
      were synthesised at ReuseFactor 1, 4, 8, and 16.

    data_characteristics: >-
      529,507 total designs: 485,905 on nangate45 (4.4 TB) and 43,602 on gf22fdx
      (50 GB). Architecture coverage: 1–10 dense layers; neuron counts 4, 8, 16,
      32, 64 (128 for 1-layer extension); bitwidths 4–14 (even); activations
      relu/sigmoid/tanh; ReuseFactor 1/4/8/16. 1–3-layer sweeps are full
      Cartesian products; 4–10-layer and GF22FDX 2–3-layer sweeps use LHS
      (N=2,500–10,000 samples each). Each design is stored as one JSON report and
      one synthesis tarball.

    limitations: >-
      (1) Fixed 5 ns clock (200 MHz); timing closure at other targets not included.
      (2) BramFactor=0 for all designs — no block-RAM inference.
      (3) 3% of 3-layer Cartesian designs may share identical RTL due to Catapult
      AutoCompact but differ as synthesis parameter-space entries.
      (4) GF22FDX 2-layer Pass 1 (3,076 designs) has restricted coverage
      (bitwidths {6,10,14} and size=64 under-sampled due to a deduplication bug).
      (5) 1,341 fixed-weight/superseded designs from legacy 3-layer random runs are
      archived but excluded from the training-eligible count.

